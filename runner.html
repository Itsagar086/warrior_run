<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Warrior Run — Game Host</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0d0d14; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: 'Segoe UI', sans-serif; }
    #status { color: #4de0c0; font-size: 14px; margin-bottom: 12px; letter-spacing: 1px; }
    #frame-wrap { position: relative; width: 100vw; height: 100vh; }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <div id="frame-wrap">
    <iframe id="game-frame" src="index.html" allow="autoplay" sandbox="allow-scripts allow-same-origin"></iframe>
  </div>

  <script>
    const frame = document.getElementById('game-frame');
    const status = document.getElementById('status');

    // Read all four JS files in order, then post to iframe
    async function loadAndInject() {
      try {
        const [assetsCode, stateCode, uiCode, mainCode] = await Promise.all([
          fetch('game-assets-v2.js').then(r => r.text()),
          fetch('game-state-v2.js').then(r => r.text()),
          fetch('game-ui-v2.js').then(r => r.text()),
          fetch('game-main-v2.js').then(r => r.text()),
        ]);

        // Wait for iframe to finish loading before posting
        frame.addEventListener('load', () => {
          frame.contentWindow.postMessage({
            kind: 'load',
            assetsCode,
            stateCode,
            uiCode,
            mainCode,
          }, '*');
        }, { once: true });

        // If iframe already loaded (cached), post immediately
        if (frame.contentDocument && frame.contentDocument.readyState === 'complete') {
          frame.contentWindow.postMessage({
            kind: 'load',
            assetsCode,
            stateCode,
            uiCode,
            mainCode,
          }, '*');
        }
      } catch (err) {
        console.error('Failed to load game files:', err);
      }
    }

    loadAndInject();

    // Listen for ready / error messages from sandbox
    window.addEventListener('message', (e) => {
      const d = e.data;
      if (!d || typeof d !== 'object') return;
      if (d.kind === 'ready') {
        console.log('[host] Game is ready');
      } else if (d.kind === 'error') {
        console.error('[host] Game error:', d.message);
      }
    });
  </script>
</body>
</html>
